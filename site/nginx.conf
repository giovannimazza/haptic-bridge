# nginx for the Haptic Gaming Bridge site, meant for the unprivileged nginx image (listens on 8080, read-only root).
# No access log is kept: the site has no use for visitors' addresses.
worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events { worker_connections 512; }

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log off;
  server_tokens off;
  sendfile on;
  gzip on;
  gzip_min_length 512;
  gzip_types text/css application/javascript image/svg+xml;

  # Writable paths for a read-only container.
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;

  server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # The pages carry the same policy in a <meta> tag; this header adds frame-ancestors, which a meta tag cannot.
    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src https://api.github.com; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;

    # Only GET and HEAD make sense for a static site.
    if ($request_method !~ ^(GET|HEAD)$) { return 405; }

    location / { try_files $uri $uri/ =404; }
    location /assets/ { expires 7d; }   # expires adds Cache-Control without replacing the headers above
  }
}
