<svg xmlns="http://www.w3.org/2000/svg" width="320" height="56" viewBox="0 0 320 56" role="img" aria-label="Support me on PayPal">
  <defs>
    <linearGradient id="p" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1A8AD8"/>
      <stop offset="1" stop-color="#0070BA"/>
    </linearGradient>
  </defs>
  <rect width="320" height="56" rx="14" fill="url(#p)"/>
  <!-- two overlapping P, like the PayPal mark -->
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="36" font-weight="900" font-style="italic">
    <text x="30" y="40" fill="#9CD0FF">P</text>
    <text x="22" y="42" fill="#FFFFFF">P</text>
  </g>
  <text x="72" y="35" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#FFFFFF">Support me on PayPal</text>
</svg>
